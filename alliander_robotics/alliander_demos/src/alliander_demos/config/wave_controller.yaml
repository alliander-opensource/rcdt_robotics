wave_controller:
  ros__parameters:
    joints:
      - fr3_joint1 
      - fr3_joint2 
      - fr3_joint3 
      - fr3_joint4 
      - fr3_joint5 
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.05
