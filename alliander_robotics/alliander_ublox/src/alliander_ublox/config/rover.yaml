# From https://github.com/aussierobots/ublox_dgnss/blob/main/ublox_dgnss/launch/ublox_x20p_rover_hpposllh.launch.py
ublox_dgnss:
  ros__parameters:
    DEVICE_FAMILY: substitute_me
    DEVICE_SERIAL_STRING: substitute_me
    FRAME_ID: substitute_me
    CFG_USBOUTPROT_NMEA: False
    CFG_RATE_MEAS: 200 
    CFG_RATE_NAV: 1
    
    # USB output (for 0x01ab CDC-ACM interface)
    CFG_MSGOUT_UBX_NAV_HPPOSLLH_USB: 1
    CFG_MSGOUT_UBX_NAV_STATUS_USB: 5
    CFG_MSGOUT_UBX_NAV_COV_USB: 1
    CFG_MSGOUT_UBX_RXM_RTCM_USB: 1
    
    # RTCM and UBX messages as required on USB
    CFG_USBINPROT_NMEA: false
    CFG_USBINPROT_RTCM3X: true
    CFG_USBINPROT_UBX: true
    CFG_USBOUTPROT_NMEA: false
    CFG_USBOUTPROT_RTCM3X: false
    CFG_USBOUTPROT_UBX: true

    # messages required for navsatfix calcs by ROS node
    CFG_MSGOUT_UBX_NAV_HPPOSLLH_USB: 1
    CFG_MSGOUT_UBX_NAV_COV_USB: 1
    CFG_MSGOUT_UBX_NAV_STATUS_USB: 1
    CFG_MSGOUT_UBX_NAV_PVT_USB: 1
