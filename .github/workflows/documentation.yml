name: documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/documentation.yml

jobs:
  # Based on: https://www.sphinx-doc.org/en/master/tutorial/deploying.html#
  build:
    runs-on:
      group: managed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true
      - name: Build HTML
        uses: ammaraskar/sphinx-action@54e52bfb642e9b60ea5b6bcb05fe3f74b40d290a # v8.2.3
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: docs/build/html/
  # Based on: https://github.com/marketplace/actions/deploy-github-pages-site
  deploy:
    needs: build
    runs-on:
      group: managed
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
