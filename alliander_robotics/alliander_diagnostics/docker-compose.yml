services:
  alliander_diagnostics:
    image: allianderrobotics/diagnostics
    container_name: alliander_diagnostics
    runtime: nvidia
    network_mode: host
    privileged: true
    mem_limit: 6gb
    tty: true
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "/dev:/dev"
      - "$HOME/.transitive:/root/.transitive"
    env_file:
      - .env
    command: ["/bin/bash", "-c", ". /transitive/start.sh & ros2 launch alliander_diagnostics diagnostics.launch.py"]
