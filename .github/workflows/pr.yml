name: pr

permissions:
  contents: read
  issues: read
  pull-requests: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  select-components:
    runs-on:
      group: managed-linux
    outputs:
      REBUILD_CORE: ${{ steps.variables.outputs.REBUILD_CORE }}
      UBUNTU_COMPONENTS: ${{ steps.variables.outputs.UBUNTU_COMPONENTS }}
      REBUILD_UBUNTU_IMAGES: ${{ steps.variables.outputs.REBUILD_UBUNTU_IMAGES }}
      CUDA_COMPONENTS: ${{ steps.variables.outputs.CUDA_COMPONENTS }}
      REBUILD_CUDA_IMAGES: ${{ steps.variables.outputs.REBUILD_CUDA_IMAGES }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - id: variables
        run: uv run github.py --select-components changed

  build-ubuntu:
    needs: select-components
    if: needs.select-components.outputs.REBUILD_CORE == 'true'
    strategy:
      matrix:
        runner: [mgd-ubuntu24-x64-4c16g, mgd-ubuntu24-arm64-4c16g]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check architecture
        uses: $/.github/actions/check-architecture
        with:
          expected: ${{ matrix.runner }}
      - name: Deploy image
        uses: $/.github/actions/deploy-image
        with:
          component: base
          tag: ${{ env.BRANCH_NAME }}
          runner: ${{ matrix.runner }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-ubuntu-manifest:
    needs: build-ubuntu
    runs-on:
      group: managed-linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create manifest
        uses: $/.github/actions/create-manifest
        with:
          components: '["base"]'
          tag: ${{ env.BRANCH_NAME }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-ubuntu-images:
    needs: [select-components, build-ubuntu, build-ubuntu-manifest]
    if: ${{ !failure() && !cancelled() && needs.select-components.outputs.REBUILD_UBUNTU_IMAGES == 'true' }}
    strategy:
      matrix:
        runner: [mgd-ubuntu24-x64-4c16g, mgd-ubuntu24-arm64-4c16g]
        component: ${{ fromJSON(needs.select-components.outputs.UBUNTU_COMPONENTS) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check architecture
        uses: $/.github/actions/check-architecture
        with:
          expected: ${{ matrix.runner }}
      - name: Deploy image
        uses: $/.github/actions/deploy-image
        with:
          component: ${{ matrix.component }}
          tag: ${{ env.BRANCH_NAME }}
          base_image_tag: ${{ needs.select-components.outputs.REBUILD_CORE == 'true' && env.BRANCH_NAME || 'latest' }}
          runner: ${{ matrix.runner }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-ubuntu-images-manifest:
    needs: [select-components, build-ubuntu-images]
    if: ${{ !failure() && !cancelled() && needs.select-components.outputs.REBUILD_UBUNTU_IMAGES == 'true' }}
    runs-on:
      group: managed-linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create manifest
        uses: $/.github/actions/create-manifest
        with:
          components: ${{ needs.select-components.outputs.UBUNTU_COMPONENTS}}
          tag: ${{ env.BRANCH_NAME }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-cuda:
    needs: [select-components]
    if: needs.select-components.outputs.REBUILD_CORE == 'true'
    strategy:
      matrix:
        runner: [mgd-ubuntu24-x64-4c16g, mgd-ubuntu24-arm64-4c16g]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check architecture
        uses: $/.github/actions/check-architecture
        with:
          expected: ${{ matrix.runner }}
      - name: Deploy image
        uses: $/.github/actions/deploy-image
        with:
          component: cuda
          tag: ${{ env.BRANCH_NAME }}
          runner: ${{ matrix.runner }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-cuda-manifest:
    needs: build-cuda
    runs-on:
      group: managed-linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create manifest
        uses: $/.github/actions/create-manifest
        with:
          components: '["cuda"]'
          tag: ${{ env.BRANCH_NAME }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-cuda-images:
    needs: [select-components, build-cuda, build-cuda-manifest]
    if: ${{ !failure() && !cancelled() && needs.select-components.outputs.REBUILD_CUDA_IMAGES == 'true' }}
    strategy:
      matrix:
        runner: [mgd-ubuntu24-x64-4c16g, mgd-ubuntu24-arm64-4c16g]
        component: ${{ fromJSON(needs.select-components.outputs.CUDA_COMPONENTS) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check architecture
        uses: $/.github/actions/check-architecture
        with:
          expected: ${{ matrix.runner }}
      - name: Deploy image
        uses: $/.github/actions/deploy-image
        with:
          component: ${{ matrix.component }}
          tag: ${{ env.BRANCH_NAME }}
          base_image_tag: ${{ needs.select-components.outputs.REBUILD_CORE == 'true' && env.BRANCH_NAME || 'latest' }}
          runner: ${{ matrix.runner }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  build-cuda-images-manifest:
    needs: [select-components, build-cuda-images]
    if: ${{ !failure() && !cancelled() && needs.select-components.outputs.REBUILD_CUDA_IMAGES == 'true' }}
    runs-on:
      group: managed-linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create manifest
        uses: $/.github/actions/create-manifest
        with:
          components: ${{ needs.select-components.outputs.CUDA_COMPONENTS }}
          tag: ${{ env.BRANCH_NAME }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  linting:
    needs:
      [
        build-ubuntu-images,
        build-ubuntu-images-manifest,
        build-cuda-images,
        build-cuda-images-manifest,
      ]
    if: ${{ !failure() && !cancelled() }}
    runs-on:
      group: managed-linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Run linting in alliander_tests container
        run: uv run start.py --linting

  test:
    needs:
      [
        build-ubuntu-images,
        build-ubuntu-images-manifest,
        build-cuda-images,
        build-cuda-images-manifest,
      ]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [mgd-ubuntu24-x64-4c16g, mgd-ubuntu24-arm64-4c16g]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: false
      - name: Check architecture
        uses: $/.github/actions/check-architecture
        with:
          expected: ${{ matrix.runner }}
      - name: Docker login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Run tests in alliander_tests container
        run: uv run start.py --pytest-no-nvidia
      - run: |
          echo "Disk space after tests:"
          df -h /
